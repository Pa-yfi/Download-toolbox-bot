services:
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    restart: unless-stopped
    volumes:
      - botdata:/app/data

  # OPTIONAL: self-hosted Bot API server -> 2GB uploads.
  # 1. Get api_id/api_hash from https://my.telegram.org
  # 2. Uncomment, fill the env vars, set LOCAL_API_URL=http://telegram-api:8081 in .env
  # telegram-api:
  #   image: aiogram/telegram-bot-api:latest
  #   environment:
  #     TELEGRAM_API_ID: "your_api_id"
  #     TELEGRAM_API_HASH: "your_api_hash"
  #   restart: unless-stopped

volumes:
  botdata:
